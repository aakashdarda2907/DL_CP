{% extends "base.html" %}
{% block title %}Profile — WeightCoachAI{% endblock %}
{% block content %}
<div class="container" style="max-width:600px; padding-top:40px; padding-bottom:60px;">
    <h2>Your profile</h2>
    <div class="surface">
        <form method="POST">
            {% csrf_token %}
            <div class="field-row">
                <div class="field"><label>Height (cm)</label><input type="number" step="0.1" name="height_cm" value="{{ user_obj.height_cm|default:'' }}"></div>
                <div class="field"><label>Age</label><input type="number" name="age" value="{{ user_obj.age|default:'' }}"></div>
            </div>
            <div class="field-row">
                <div class="field"><label>Current weight (kg)</label><input type="number" step="0.1" name="current_weight_kg" value="{{ user_obj.current_weight_kg|default:'' }}"></div>
                <div class="field"><label>Target weight (kg)</label><input type="number" step="0.1" name="target_weight_kg" value="{{ user_obj.target_weight_kg|default:'' }}"></div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Goal</label>
                    <select name="goal">
                        <option value="lose" {% if user_obj.goal == 'lose' %}selected{% endif %}>Lose weight</option>
                        <option value="gain" {% if user_obj.goal == 'gain' %}selected{% endif %}>Gain weight</option>
                        <option value="maintain" {% if user_obj.goal == 'maintain' %}selected{% endif %}>Maintain weight</option>
                    </select>
                </div>
                <div class="field">
                    <label>Activity level</label>
                    <select name="activity_level">
                        <option value="sedentary" {% if user_obj.activity_level == 'sedentary' %}selected{% endif %}>Sedentary</option>
                        <option value="light" {% if user_obj.activity_level == 'light' %}selected{% endif %}>Lightly active</option>
                        <option value="moderate" {% if user_obj.activity_level == 'moderate' %}selected{% endif %}>Moderately active</option>
                        <option value="active" {% if user_obj.activity_level == 'active' %}selected{% endif %}>Very active</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>Coaching style</label>
                <p class="text-soft" style="margin:0 0 10px; font-size:0.88rem;">Changes how your AI coach talks to you <em>and</em> how quickly it adjusts your calories.</p>
                <div class="style-options">
                    <label class="style-option">
                        <input type="radio" name="coaching_style" value="strict" {% if user_obj.coaching_style == 'strict' %}checked{% endif %}>
                        <span class="style-card">
                            <strong>Strict</strong>
                            <span>Direct and firm. Quick to adjust calories when you drift off goal.</span>
                        </span>
                    </label>
                    <label class="style-option">
                        <input type="radio" name="coaching_style" value="motivational" {% if user_obj.coaching_style == 'motivational' or not user_obj.coaching_style %}checked{% endif %}>
                        <span class="style-card">
                            <strong>Motivational</strong>
                            <span>Upbeat and balanced. Celebrates wins, adjusts at a moderate pace.</span>
                        </span>
                    </label>
                    <label class="style-option">
                        <input type="radio" name="coaching_style" value="gentle" {% if user_obj.coaching_style == 'gentle' %}checked{% endif %}>
                        <span class="style-card">
                            <strong>Gentle</strong>
                            <span>Kind and patient. Prefers keeping the plan and building consistency first.</span>
                        </span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save changes</button>
        </form>
    </div>
</div>
{% endblock %}
