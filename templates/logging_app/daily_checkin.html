{% extends "base.html" %}
{% block title %}Daily check-in{% endblock %}
{% block content %}
<div class="container" style="max-width:460px; padding:40px 24px 60px;">
    <h2>Daily check-in</h2>
    <div class="surface">
        <form method="POST">
            {% csrf_token %}
            <div class="field">
                <label>Mood</label>
                <select name="mood">
                    <option value="great">Great</option>
                    <option value="okay">Okay</option>
                    <option value="low">Low</option>
                    <option value="stressed">Stressed</option>
                </select>
            </div>
            <div class="field-row">
                <div class="field"><label>Energy (1-5)</label><input type="number" name="energy_level" min="1" max="5"></div>
                <div class="field"><label>Adherence (1-5)</label><input type="number" name="adherence_score" min="1" max="5"></div>
            </div>
            <div class="field"><label>Notes</label><textarea name="notes" placeholder="Anything else worth noting today"></textarea></div>
            <button type="submit" class="btn btn-primary btn-block">Save check-in</button>
        </form>
    </div>
</div>
{% endblock %}
